<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f4ef"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9962e"/><stop offset="1" stop-color="#8a5f14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#c9962e" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#c9962e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#e9e5db"/>
    </pattern>
    <clipPath id="r"><rect width="1200" height="320" rx="20"/></clipPath>
    <style>
      .fade { animation: f 1.2s ease-out both; }
      .d1 { animation-delay: .15s } .d2 { animation-delay: .35s } .d3 { animation-delay: .55s }
      @keyframes f { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
      .line { stroke-dasharray: 120; stroke-dashoffset: 120; animation: d 1.4s .2s ease-out forwards; }
      @keyframes d { to { stroke-dashoffset: 0 } }
    </style>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#dots)" opacity="0.9"/>
    <rect width="1200" height="320" fill="url(#glow)"/>
    <g opacity="0.55" fill="none" stroke="url(#gold)" stroke-width="1">
      <circle cx="1040" cy="150" r="70"/><circle cx="1040" cy="150" r="110" opacity=".6"/>
      <circle cx="1040" cy="150" r="150" opacity=".35"/><circle cx="1040" cy="150" r="190" opacity=".18"/>
    </g>
    <text x="1040" y="166" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif" font-size="46" font-weight="300"
          letter-spacing="2" fill="url(#gold)">BM</text>
  </g>
  <rect x=".5" y=".5" width="1199" height="319" rx="20" fill="none" stroke="#e4e0d6"/>
  <text class="fade" x="72" y="98" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="15" letter-spacing="4" fill="#8a92a1">BTECH CSE  ·  KARNATAKA, INDIA</text>
  <line class="line" x1="72" y1="122" x2="192" y2="122" stroke="url(#gold)" stroke-width="2"/>
  <text class="fade d1" x="70" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-1.5" fill="#14161b">Bharath Marambeed</text>
  <text class="fade d2" x="72" y="236" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif" font-size="22" fill="#4b5363">Full-stack developer building with <tspan fill="#8a5f14">Java</tspan>, the web, and <tspan fill="#8a5f14">AI agents</tspan>.</text>
</svg>
